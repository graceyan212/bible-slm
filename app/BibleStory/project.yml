name: BibleStory
options:
  bundleIdPrefix: com.graceyan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BibleStoryCore:
    path: ../BibleStoryCore
  # ── On-device model (Apple MLX) — TEMPORARILY DISABLED, see MLX-SETUP.md ──────────
  # The wiring is COMPLETE and compiles against the real API (MLXModelEngine.swift,
  # FallbackModelEngine.swift, ModelLoadState.swift, BibleStoryApp.makeEngine — all
  # guarded by `#if canImport(MLXLLM)…`, so with these deps absent the app builds and
  # runs on ScriptedModelEngine). To ENABLE the real model, uncomment the four package
  # entries below AND the six product dependencies in the target, then `xcodegen generate`.
  #
  # BLOCKER (2026-07): `swift-transformers`'s `Hub` module does not compile under
  # Swift 6.3.3 / Xcode 26 (an `ObjectKey`/generics error in Hub/Config.swift — upstream,
  # not our code). Re-enable once swift-transformers ships a Swift-6.3-compatible release,
  # or build with an Xcode whose Swift is ≤ 6.2.
  #
  # mlx-swift-lm:
  #   url: https://github.com/ml-explore/mlx-swift-lm
  #   branch: main          # pin to a tag before shipping
  # swift-huggingface:
  #   url: https://github.com/huggingface/swift-huggingface
  #   from: "0.9.0"
  # swift-transformers:
  #   url: https://github.com/huggingface/swift-transformers
  #   from: "1.3.0"
targets:
  BibleStory:
    type: application
    platform: iOS
    sources:
      - path: BibleStory
    dependencies:
      - package: BibleStoryCore
        product: BibleStoryCore
      # ── Uncomment to enable the on-device MLX model (see note above + MLX-SETUP.md) ──
      # - package: mlx-swift-lm
      #   product: MLXLLM
      # - package: mlx-swift-lm
      #   product: MLXLMCommon
      # - package: mlx-swift-lm
      #   product: MLXHuggingFace
      # - package: swift-huggingface
      #   product: HuggingFace
      # - package: swift-transformers
      #   product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graceyan.treasuretrail
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "True North"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Confirm you're a grown-up to open the parent area."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Poli listens so you can ask questions out loud."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Your words become text on this device so Poli can understand your question."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEVELOPMENT_TEAM: 4DMP5UV5S6
        CODE_SIGN_STYLE: Automatic
  BibleStoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BibleStoryUITests
    dependencies:
      - target: BibleStory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graceyan.treasuretrail.uitests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BibleStory
        DEVELOPMENT_TEAM: 4DMP5UV5S6
        CODE_SIGN_STYLE: Automatic
schemes:
  BibleStory:
    build:
      targets:
        BibleStory: all
        BibleStoryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BibleStoryUITests
