name: BibleStory
options:
  bundleIdPrefix: com.graceyan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BibleStoryCore:
    path: ../BibleStoryCore
targets:
  BibleStory:
    type: application
    platform: iOS
    sources:
      - path: BibleStory
    dependencies:
      - package: BibleStoryCore
        product: BibleStoryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graceyan.treasuretrail
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Confirm you're a grown-up to open the parent area."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  BibleStoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BibleStoryUITests
    dependencies:
      - target: BibleStory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graceyan.treasuretrail.uitests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BibleStory
schemes:
  BibleStory:
    build:
      targets:
        BibleStory: all
        BibleStoryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BibleStoryUITests
